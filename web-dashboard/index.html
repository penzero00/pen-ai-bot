<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PenBot // Autonomous Desktop Robot OS</title>
  <script>
    (function() {
      // Automatic Device / Screen Responsive Router
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 768);
      const target = isMobile ? 'mobile/' : 'desktop/';
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#09090b; color:#71717a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <noscript>
    <div style="text-align:center;">
      <p style="color:#06b6d4; font-weight:bold;">PenBot Robot OS</p>
      <p><a href="desktop/" style="color:#38bdf8; text-decoration:none; margin-right:12px;">Desktop Studio</a> <a href="mobile/" style="color:#34d399; text-decoration:none;">Mobile View</a></p>
    </div>
  </noscript>
</body>
</html>
