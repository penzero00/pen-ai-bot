; ============================================================================
; PEN-AI-BOT (CYBER-CUBE MINI) — PlatformIO Configuration
; ESP32-S3 DevKitC-1 (N16R8): 16MB QIO Flash, 8MB OPI PSRAM
; ============================================================================

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 16MB Flash & 8MB Octal PSRAM Memory Configuration ---
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py

; --- Build Flags ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI User Setup (ST7789 240x240 locked to AGENTS.md pinout) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=13
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; --- Monitor ---
monitor_speed = 115200

; --- Library Dependencies ---
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    madhephaestus/ESP32Servo @ ^3.0.5
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.1
